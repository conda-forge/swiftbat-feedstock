{% set name = "swiftbat" %}
{% set version = "0.1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/swiftbat-{{ version }}.tar.gz
  sha256: bbed4748c264b5a94050e6312d56abbfbd8ae094014167f5fdf81f572ea17ffc

build:
  entry_points:
    - swinfo=swiftbat.swinfo:swinfo_main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - pip
  run:
    - python >=3.9
    - astropy >=5
    - astroquery
    - numpy
    - python-dateutil
    - skyfield >=1.4
    - swifttools

test:
  imports:
    - swiftbat
  commands:
    - pip check
    - swinfo --help
  requires:
    - pip

about:
  home: https://github.com/lanl/swiftbat_python/
  summary: Routines for dealing with data from BAT on the Neil Gehrels Swift Observatory
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaeakle
